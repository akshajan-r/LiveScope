[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livescope"
version = "0.1.0"
description = "Live-streaming creator analytics: Twitch ingestion, SQL models, segmentation, growth prediction and experiment analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0"]
ucsd = ["gdown>=5.2"]
bq = ["google-cloud-bigquery>=3.20"]
spark = ["pyspark>=3.5"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "lightgbm>=4.0", "matplotlib>=3.8"]

[project.scripts]
livescope = "livescope.cli:main"

[tool.setuptools.packages.find]
include = ["livescope*"]

[tool.setuptools.package-data]
livescope = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
